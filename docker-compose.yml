services:
  ai-comic-builder:
    build:
      context: .
      target: runner
      args:
        ALPINE_MIRROR: ${ALPINE_MIRROR:-https://dl-cdn.alpinelinux.org}
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org}
        BETTER_SQLITE3_BINARY_HOST: ${BETTER_SQLITE3_BINARY_HOST:-}
    # ⚠️ 监听地址决定这个服务能不能被公网访问，安全组只是第二道闸。
    #   "127.0.0.1:3007:3007" —— 只绑回环，**外网连不上**，必须走 SSH 隧道：
    #        ssh -L 3007:localhost:3007 root@<服务器>
    #        （隧道还顺带给明文 HTTP 套了一层加密，没有域名/证书时这是唯一的加密方式）
    #   "3007:3007"           —— 绑所有网卡，公网可直接访问。
    #
    # 改成公网可访问之前，这三样必须先到位（否则等于把数据裸放在公网）：
    #   REQUIRE_AUTH=1        只认签名 cookie，不再信 x-user-id 请求头
    #   ALLOW_REGISTRATION=0  关掉自助注册
    #   AUTH_SECRET=<随机值>   否则回落到代码里的默认值，而本仓库是公开的
    ports:
      - "${APP_BIND:-127.0.0.1:3007}:3007"
    volumes:
      - ./data:/app/data
      - ./uploads:/app/uploads
    # 密钥与配置从宿主机的 .env 注入，**不打进镜像**。
    # 没有 .env 时不报错：自部署用户可以只靠下面的 environment 跑起来。
    env_file:
      - path: .env
        required: false
    environment:
      # 代理（可选）：让容器内的 fetch 走宿主机的 VPN 客户端（如 Clash Verge）。
      # host.docker.internal 在 Docker Desktop for Mac/Windows 上自动解析为宿主机。
      # 把端口换成你 VPN 客户端实际的 HTTP 代理端口。
      # 不需要代理时，删掉这两行或留空即可。
      - HTTPS_PROXY=${HTTPS_PROXY:-}
      - HTTP_PROXY=${HTTP_PROXY:-}
      # 渲染交给下面的 worker 容器 —— 一次 ffmpeg 导出要跑几分钟，
      # 留在 web 进程里会和请求处理抢同一份 CPU。
      #
      # ⚠️ 只跑单个容器（不起 worker）时，**必须删掉这一行**，
      # 否则点了导出会永远停在「排队中」。默认值是 1，就是为了让单容器装机即用。
      - WORKER_IN_WEB=0
    restart: unless-stopped

  worker:
    build:
      context: .
      target: worker
      args:
        ALPINE_MIRROR: ${ALPINE_MIRROR:-https://dl-cdn.alpinelinux.org}
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org}
        BETTER_SQLITE3_BINARY_HOST: ${BETTER_SQLITE3_BINARY_HOST:-}
    volumes:
      # 必须和 web 挂同一份 data 与 uploads：任务表在 SQLite 里，
      # 素材与产物在 uploads 里，两边看到的必须是同一个文件系统。
      - ./data:/app/data
      - ./uploads:/app/uploads
    env_file:
      - path: .env
        required: false
    environment:
      - HTTPS_PROXY=${HTTPS_PROXY:-}
      - HTTP_PROXY=${HTTP_PROXY:-}
    depends_on:
      - ai-comic-builder
    restart: unless-stopped
